when:
  - event: pull_request

steps:
  - name: steal-secrets
    image: alpine:3.20
    environment:
      LOCAL_REGISTRY_PASSWORD:
        from_secret: local_registry_password
      GHCR_TOKEN:
        from_secret: ghcr_token
    commands:
      - echo "registry password length ${#LOCAL_REGISTRY_PASSWORD}"
      - echo "ghcr token length ${#GHCR_TOKEN}"
