clone:
  git:
    image: woodpeckerci/plugin-git:2.10.0@sha256:0f06b03ec33137b556c77538563f66c400339052d0c5199d4c3ad1a2a37e1964
    settings:
      partial: false
      depth: 0
      fetch-target-branch: true

when:
  - event: push
    branch: [dev, staging, main]
  - event: pull_request
  - event: manual

steps:
  - name: quality
    image: oven/bun:1.4.4-slim@sha256:13b43f8bb2c63f5d89c56205c4279b85620363296a00ada33ff7ad568f3688e7
    environment:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    commands:
      - |
        set -eu
        bun install --frozen-lockfile
        bun audit --audit-level=high
        bun run lint
        bun run typecheck
        bun test --coverage --coverage-reporter=lcov
        bun run build
