when:
  - event: pull_request

services:
  docker:
    image: docker:29.1.3-dind@sha256:64d6ee47ea821c986467199baa162f5ac8cde3f57b719f18e23f3ed7a7444131
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    commands:
      - dockerd-entrypoint.sh --host=tcp://0.0.0.0:2375 --tls=false --insecure-registry=registry:5000

steps:
  - name: escape
    image: docker:29.1.3-cli@sha256:e0b6ff45302985d99b9685b2a2fec50c3379bd47067493968f51da901dc53ad5
    environment:
      DOCKER_HOST: tcp://docker:2375
    commands:
      - |
        probe() { if eval "$2" >/dev/null 2>&1; then echo "OPEN    $1"; else echo "blocked $1"; fi; }
        for attempt in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 1; done
        probe "woodpecker server" "nc -z -w 4 server 9000"
        probe "woodpecker api via host" "nc -z -w 4 10.0.2.2 8000"
        probe "stack lan" "nc -z -w 4 10.10.40.83 8000"
        probe "home router" "nc -z -w 4 192.168.1.1 80"
        probe "smtp 25" "nc -z -w 4 smtp.gmail.com 25"
        probe "port 8080" "nc -z -w 4 portquiz.net 8080"
        probe "https" "nc -z -w 4 github.com 443"
        docker pull -q alpine:3.20 >/dev/null
        docker tag alpine:3.20 registry:5000/typetype/token-beta:zoonk
        probe "anonymous push to token-beta" "docker push registry:5000/typetype/token-beta:zoonk"
        probe "host disk mount from dind" "docker run --rm --privileged alpine:3.20 sh -c 'mkdir -p /m && mount /dev/sda1 /m'"
        before=$(awk '/usage_usec/ {print $2}' /sys/fs/cgroup/cpu.stat)
        for i in $(seq 1 48); do (end=$(($(date +%s) + 15)); while [ "$(date +%s)" -lt "$end" ]; do :; done) & done; wait
        after=$(awk '/usage_usec/ {print $2}' /sys/fs/cgroup/cpu.stat)
        echo "cpu: 48 busy loops got about $(( (after - before) / 15000000 )) cores in this step"

  - name: marathon
    image: alpine:3.20
    commands:
      - echo "start $(date -u +%T)"
      - sleep 600
      - echo "still alive after ten minutes"
