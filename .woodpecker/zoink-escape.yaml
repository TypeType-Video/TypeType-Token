when:
  - event: pull_request

services:
  docker:
    image: docker:29.1.3-dind@sha256:64d6ee47ea821c986467199baa162f5ac8cde3f57b719f18e23f3ed7a7444131
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    commands:
      - dockerd-entrypoint.sh --host=tcp://0.0.0.0:2375 --tls=false --insecure-registry=registry:5000

steps:
  - name: escape
    image: docker:29.1.3-cli@sha256:e0b6ff45302985d99b9685b2a2fec50c3379bd47067493968f51da901dc53ad5
    environment:
      DOCKER_HOST: tcp://docker:2375
    commands:
      - |
        probe() { if eval "$2" >/dev/null 2>&1; then echo "OPEN    $1"; else echo "blocked $1"; fi; }
        for attempt in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 1; done
        id
        probe "woodpecker server grpc" "wget -q -T 4 -O /dev/null http://server:9000"
        probe "woodpecker api via host" "wget -q -T 4 -O /dev/null http://10.0.2.2:8000"
        probe "stack lan address" "wget -q -T 4 -O /dev/null http://10.10.40.83:8000"
        probe "home lan router" "wget -q -T 4 -O /dev/null http://192.168.1.1"
        probe "idrac link local" "wget -q -T 4 -O /dev/null http://169.254.1.1"
        probe "host docker socket" "test -S /var/run/docker.sock"
        probe "anonymous registry read" "wget -q -T 4 -O /dev/null http://registry:5000/v2/"
        docker pull -q alpine:3.20 >/dev/null
        docker tag alpine:3.20 registry:5000/typetype/token-beta:zoink
        probe "anonymous push to token-beta" "docker push registry:5000/typetype/token-beta:zoink"
        probe "host disk mount from dind" "docker run --rm --privileged alpine:3.20 sh -c 'mkdir -p /m && mount /dev/sda1 /m'"
        probe "internet" "wget -q -T 8 -O /dev/null https://github.com"
